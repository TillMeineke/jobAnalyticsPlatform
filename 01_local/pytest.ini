[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mark tests that require specific environments
markers = 
    integration: marks tests that require a running test environment (docker-compose)
    slow: marks tests that are slow and might be skipped in normal runs
    scraper: marks tests that test web scraping functionality
    pipeline: marks tests that test data pipeline functionality
    dbt: marks tests that test dbt models
    workflow: marks tests that test workflow orchestration
    dashboard: marks tests that test dashboard functionality

# Show more verbose output for test failures
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Add coverage settings
addopts = --cov=src --cov-report=term-missing

# Set environment variables for tests
env = 
    ENV=test
    DB_USER=test_user
    DB_PASSWORD=test_password
    DB_HOST=localhost
    DB_PORT=5432
    DB_NAME=job_analytics_test