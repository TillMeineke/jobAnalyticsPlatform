id: job_scraper
namespace: company.team

variables:
  job_title: data engineer
  location: hamburg
  max_pages: 2

tasks:
  - id: scrape_jobs
    type: io.kestra.plugin.scripts.python.Script
    inputFiles:
      script.py: |
        import sys
        sys.path.append("/app")
        from src.scrapers.stepstone import StepStoneScraper

        scraper = StepStoneScraper()
        results = scraper.search(
            job_titles=["{{ job_title }}"],
            location="{{ location }}",
            max_pages={{ max_pages }}
        )
        print(f"Found {len(results)} job listings")

  - id: load_to_database
    type: io.kestra.plugin.scripts.python.Script
    dependsOn:
      - scrape_jobs
    inputFiles:
      script.py: |
        import sys
        sys.path.append("/app")
        from src.dlt_pipelines.bronze_ingest import run_pipeline

        run_pipeline()

triggers:
  - id: schedule
    type: io.kestra.core.models.triggers.types.Schedule
    cron: "0 0 * * *" # Run at midnight every day
