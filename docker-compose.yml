services:
  job-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./.dlt:/app/.dlt
    environment:
      - ENV=dev
    command: python src/run_scraper.py
    networks:
      - job-analytics-network

  metabase:
    image: metabase/metabase:latest
    platform: linux/amd64 # Use amd64 with emulation since arm64 isn't available
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=metabase
      - MB_DB_PASS=metabase
      - MB_DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - job-analytics-network

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql-init.sh:/docker-entrypoint-initdb.d/postgresql-init.sh
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: kestra,metabase,jobanalytics
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-analytics-network

  kestra:
    image: kestra/kestra:latest-full
    pull_policy: always
    user: "root"
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./src:/tmp/kestra-wd/src
      - ./data:/tmp/kestra-wd/data
      - ./.dlt:/tmp/kestra-wd/.dlt
      - ./flows:/tmp/kestra-wd/flows
    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          tutorialFlows:
            enabled: false
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
          server:
            basicAuth:
              enabled: true
              username: "admin@kestra.io"
              password: "admin"
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: kestra
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - job-analytics-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@jobanalytics.com
      - PGADMIN_DEFAULT_PASSWORD=jobanalytics
    ports:
      - "8085:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - job-analytics-network

networks:
  job-analytics-network:


volumes:
  postgres-data:
    driver: local
  kestra-data:
    driver: local
