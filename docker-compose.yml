version: '3.8'

services:
  job-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./.dlt:/app/.dlt
    environment:
      - ENV=dev
    command: python src/run_scraper.py
    networks:
      - job-analytics-network

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=metabase
      - MB_DB_PASS=metabase
      - MB_DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - job-analytics-network

  postgres:
    image: postgres:14
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=metabase
      - POSTGRES_PASSWORD=metabase
      - POSTGRES_DB=metabase
    networks:
      - job-analytics-network
  # Uncomment to include Kestra for orchestration when needed
  # kestra:
  #   image: kestra/kestra:latest
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - KESTRA_CONFIGURATION=/app/kestra/configuration.yml
  #   volumes:
  #     - ./kestra:/app/kestra
  #   networks:
  #     - job-analytics-network

networks:
  job-analytics-network:


volumes:
  postgres-data:
